fields:
    title:
        label: Title
        span: auto
        type: text
    slug:
        label: Slug
        span: right
        preset:
            field: title
            type: slug
        type: text
    description:
        label: Description
        size: small
        span: auto
        type: richeditor
    cover:
        label: 'Cover icon'
        mode: image
        fileTypes: 'svg, jpg, png, jpeg'
        useCaption: true
        thumbOptions:
            mode: crop
            extension: auto
        span: auto
        type: fileupload
